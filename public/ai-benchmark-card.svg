    <rect x="748" y="14" width="30" height="22" rx="2" fill="#f1f5f9" />
    <text x="756" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#475569">#5</text>
    <text x="788" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">DeepSeek-R1 (Cyber)</text>
    <text x="788" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b">DeepSeek AI · Recursive CoT Reasoning</text>
    <text x="788" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f3674">Exploit Discovery: 85.0%</text>
    <text x="1004" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f3674">88.7</text>
