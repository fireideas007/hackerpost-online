    <rect x="158" y="0" width="180" height="28" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="172" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#334155" letter-spacing="0.8">EXECUTIVE RESEARCH</text>

