  <rect x="0" y="0" width="180" height="6" fill="#991b1b" />

  <!-- Outer Structural Border -->
  <rect x="32" y="24" width="1136" height="582" rx="4" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

