<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="ai-badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a22" />
      <stop offset="100%" stop-color="#04030d" />
    </linearGradient>
    <linearGradient id="ai-badge-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="1" y="1" width="278" height="62" rx="10" fill="url(#ai-badge-bg)" stroke="url(#ai-badge-border)" stroke-width="1.5" />
  
  <!-- Trophy / Award Icon -->
  <g transform="translate(14, 15)">
    <rect width="34" height="34" rx="8" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1" />
    <path d="M12 11H22V17C22 19.8 19.8 22 17 22C14.2 22 12 19.8 12 17V11Z" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M14 26H20" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />
    <path d="M17 22V26" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="60" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#f59e0b" letter-spacing="1">TOP AI SEC LEADERBOARD</text>
  <text x="60" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="-0.2">CyberSecEval Index 2026</text>

  <!-- Rank Chip -->
  <rect x="238" y="16" width="28" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
  <text x="245" y="29" font-family="monospace" font-size="11" font-weight="900" fill="#f59e0b">#1</text>
</svg>
