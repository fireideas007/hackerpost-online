services:
  hackerpost:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackerpost_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    volumes:
      # Persist the database, user keys, and social logs across updates
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/news"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
