# Nginx Reverse Proxy Configuration for HackerPost.online
# Copy to: /etc/nginx/sites-available/hackerpost.online
# Symlink: sudo ln -s /etc/nginx/sites-available/hackerpost.online /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name hackerpost.online www.hackerpost.online;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optimization for Next.js static chunks
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
